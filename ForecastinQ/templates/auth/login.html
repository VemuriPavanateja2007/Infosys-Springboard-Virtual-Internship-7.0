{% extends "base.html" %}

{% block title %}Log In - ForecastinQ{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100 py-5" style="margin-top: -3rem;">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom border-0 shadow-lg">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 mb-3 p-3 shadow" style="width: 60px; height: 60px;">
                        <i class="bi bi-graph-up-arrow fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">ForecastinQ</h3>
                    <p class="text-muted small">Sales & AI-Assisted Demand Forecasting</p>
                </div>

                <form action="{{ url_for('auth.login') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                            <input type="text" class="form-control border-start-0 bg-light" id="username" name="username" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                            <input type="password" class="form-control border-start-0 bg-light" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm rounded-3">
                        Sign In <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <p class="small text-muted mb-2">Demo Access Credentials:</p>
                    <div class="d-flex flex-column gap-1 text-start bg-light p-3 rounded-3 border small">
                        <div><strong class="text-primary">Admin:</strong> <code>admin</code> / <code>Admin@123</code></div>
                        <div><strong class="text-success">Manager:</strong> <code>manager</code> / <code>Admin@123</code></div>
                        <div><strong class="text-info">Staff:</strong> <code>staff</code> / <code>Admin@123</code></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
